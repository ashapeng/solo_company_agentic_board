[project]
name = "agentic-board"
version = "0.1.0"
description = "A council of world-expert AI agents that deliberate as a company board"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "openai>=1.0",
    "dashscope>=1.20",
    "zai-sdk>=0.2.2",
]

[project.scripts]
board = "server.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
