[project]
name = "agentic-board"
version = "0.1.0"
description = "A council of world-expert AI agents that deliberate as a company board"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "openai>=1.0",
    "dashscope>=1.20",
    "zai-sdk>=0.2.2",
    "google-genai>=1.0,<2.0",
    "pdfplumber>=0.11.9",
    "playwright>=1.49",
    "markdownify>=0.13",
]

[project.scripts]
board = "server.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests that hit real provider APIs (skipped by default)",
]
